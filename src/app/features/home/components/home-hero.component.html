<section class="hero">
  <div class="container hero-grid">
    <div class="hero-copy">
      <p class="eyebrow">
        <span class="status-dot" aria-hidden="true"></span>{{ content().eyebrow }}
      </p>
      <h1>{{ content().title }}</h1>
      <p class="hero-description">{{ content().description }}</p>
      <div class="hero-actions">
        <a class="button button-primary" [routerLink]="consultation()"
          >{{ content().primary }}<span aria-hidden="true">↗</span></a
        >
        <a class="button button-outline" [routerLink]="homeUrl()" fragment="services"
          >{{ content().secondary }}<span aria-hidden="true">↓</span></a
        >
      </div>
      <p class="location-line"><span aria-hidden="true">◎</span>{{ content().location }}</p>
    </div>
    <div class="financial-visual" aria-hidden="true">
      <img
        class="hero-photo"
        src="/images/miami-home-hero-v2.webp"
        width="1920"
        height="1080"
        alt=""
        fetchpriority="high"
      />
    </div>
  </div>
</section>
