<nav [attr.aria-label]="label()">
  <ol>
    @for (item of items(); track item.path; let last = $last) {
      <li>
        @if (last) {
          <span aria-current="page">{{ item.label }}</span>
        } @else {
          <a [routerLink]="item.path">{{ item.label }}</a
          ><span class="separator" aria-hidden="true">/</span>
        }
      </li>
    }
  </ol>
</nav>
