<details #panel (keydown.escape)="closePanel(panel, summary)">
  <summary #summary>{{ language.content().accessibility.title }}</summary>
  <div class="preferences">
    <label [for]="idPrefix() + '-text-scale'">{{
      language.content().accessibility.textSize
    }}</label>
    <select
      [id]="idPrefix() + '-text-scale'"
      #scale
      [value]="accessibility.preferences().textScale"
      (change)="setTextScale(scale.value, panel, summary)"
    >
      <option value="100">{{ language.content().accessibility.standard }}</option>
      <option value="125">{{ language.content().accessibility.large }}</option>
      <option value="150">{{ language.content().accessibility.extraLarge }}</option>
    </select>
    <label
      ><input
        type="checkbox"
        #contrast
        [checked]="accessibility.preferences().highContrast"
        (change)="setHighContrast(contrast.checked, panel, summary)"
      />{{ language.content().accessibility.contrast }}</label
    >
    <label
      ><input
        type="checkbox"
        #motion
        [checked]="accessibility.preferences().reducedMotion"
        (change)="setReducedMotion(motion.checked, panel, summary)"
      />{{ language.content().accessibility.motion }}</label
    >
    <button type="button" (click)="reset(panel, summary)">
      {{ language.content().accessibility.reset }}
    </button>
  </div>
</details>
