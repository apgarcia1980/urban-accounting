<img
  class="masthead-photo"
  [src]="'/images/miami-' + image() + '-hero.webp'"
  [srcset]="
    '/images/miami-' +
    image() +
    '-hero-small.webp 768w, /images/miami-' +
    image() +
    '-hero.webp 1600w'
  "
  sizes="100vw"
  width="1600"
  height="900"
  alt=""
  fetchpriority="high"
/>
<div class="masthead-content"><ng-content /></div>
